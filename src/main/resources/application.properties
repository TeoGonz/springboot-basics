spring.application.name=demo

# --- Datasource Postgres (spec backend 01). El contenedor lo monta el usuario.
#     Las vars de entorno permiten sobreescribir en Docker (host = postgres). ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bitacora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bitacora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bitacora}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT (spec backend 02). El valor por defecto es de desarrollo: en Docker y
#     en producción se sobreescribe con APP_JWT_SECRET. ---
app.jwt.secret=${APP_JWT_SECRET:cambia-esta-clave-larga-de-al-menos-32-caracteres!!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# --- Recuperación de contraseña (spec backend 04) ---
app.password-reset.expiration-ms=${APP_PASSWORD_RESET_EXPIRATION_MS:1800000}
# El enlace del correo apunta al front, no a la API.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.mail.from=${APP_MAIL_FROM:bitacora@localhost}

# SMTP. Los valores por defecto describen Mailpit (docker compose), que acepta
# cualquier cosa sin autenticación y no entrega nada fuera de la máquina: así un
# clon recién bajado arranca y la recuperación funciona sin cuenta en ningún sitio.
# Para enviar a un buzón real se rellena docker/.env — ver README.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
# Sin tiempos límite, un servidor que acepta la conexión y luego se calla retiene
# para siempre el hilo del envío asíncrono; y a /forgot-password se llama sin token.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Seguimiento en vivo del pedido (spec backend 08) ---
# El único uso de async del proyecto es este SSE; sin -1 el contenedor lo aborta
# a los 30 s con AsyncRequestTimeoutException. El corte lo decide el propio Flux.
spring.mvc.async.request-timeout=-1
# 15 min de conexión y latido cada 25 s: por debajo del inactivity timeout
# habitual de proxies y balanceadores (30 s), y con reconexión invisible porque
# el primer evento de cada conexión es el estado actual.
app.orders.stream.max-duration-ms=${APP_ORDERS_STREAM_MAX_DURATION_MS:900000}
app.orders.stream.heartbeat-ms=${APP_ORDERS_STREAM_HEARTBEAT_MS:25000}

# Único uso de i18n en el backend: el texto de los correos transaccionales.
# Las respuestas de la API siguen devolviendo códigos, no frases traducidas.
spring.messages.basename=messages/email
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
