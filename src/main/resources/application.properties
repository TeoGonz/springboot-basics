spring.application.name=demo
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Datasource Postgres (spec backend 01). El contenedor lo monta el usuario.
#     Las vars de entorno permiten sobreescribir en Docker (host = postgres). ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bitacora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bitacora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bitacora}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
