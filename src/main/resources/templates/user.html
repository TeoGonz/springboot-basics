<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h1>Zona de usuario</h1>
    <p class="lead">Hola, <strong sec:authentication="name">usuario</strong>.
       Accesible con rol USER o ADMIN.</p>
    <p>Tus roles: <span sec:authentication="principal.authorities">[roles]</span></p>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-danger" type="submit">Cerrar sesión</button>
    </form>
</body>
</html>
