<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="#{user.title}">Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <div class="container py-5">
        <h1 th:text="#{user.title}">Zona de usuario</h1>
        <p class="lead">
            <span th:text="#{user.greeting}">Hola</span>,
            <strong sec:authentication="name">usuario</strong>.
            <span th:text="#{user.note}">Accesible con rol USER o ADMIN.</span>
        </p>
        <p><span th:text="#{user.roles}">Tus roles:</span>
           <span sec:authentication="principal.authorities">[roles]</span></p>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger" type="submit" th:text="#{common.logout}">Cerrar sesión</button>
        </form>
    </div>
</body>
</html>
