<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>

<!-- Nav de la app (login + zona autenticada): marca + dropdown de idioma (igual al público).
     Requiere bootstrap.bundle.min.js (dropdown) + bootstrap-icons en la página que lo use. -->
<nav th:fragment="appNav" class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/public" th:text="#{nav.brand.blog}">Bitácora del curso</a>
        <ul class="navbar-nav">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-translate me-1"></i><span th:text="#{nav.language}">Idioma</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{''(lang='es')}" th:text="#{lang.es}">Español</a></li>
                    <li><a class="dropdown-item" th:href="@{''(lang='en')}" th:text="#{lang.en}">English</a></li>
                    <li><a class="dropdown-item" th:href="@{''(lang='pt')}" th:text="#{lang.pt}">Português</a></li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<!-- Nav público (bitácora): marca + enlaces + login + dropdown de idioma al final.
     Requiere bootstrap.bundle.min.js (collapse + dropdown) en la página que lo use. -->
<nav th:fragment="publicNav" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/public">
            <i class="bi bi-journal-code me-2"></i><span th:text="#{nav.brand.blog}">Bitácora del curso</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNavItems"
                aria-controls="publicNavItems" aria-expanded="false" th:aria-label="#{nav.toggle}">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="publicNavItems">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <!--<li class="nav-item"><a class="nav-link" href="#entradas" th:text="#{nav.entries}">Entradas</a></li>
                <li class="nav-item"><a class="nav-link" href="#acerca" th:text="#{nav.about}">Acerca de</a></li> -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-translate me-1"></i><span th:text="#{nav.language}">Idioma</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{''(lang='es')}" th:text="#{lang.es}">Español</a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang='en')}" th:text="#{lang.en}">English</a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang='pt')}" th:text="#{lang.pt}">Português</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a href="/login" class="btn btn-brand btn-sm px-3" th:text="#{nav.login}">Iniciar sesión</a></li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
