<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <nav th:replace="~{fragments/nav :: appNav}"></nav>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h1 class="mb-4" th:text="#{login.title}">Iniciar sesión</h1>

                <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">
                    Usuario o contraseña incorrectos.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}">
                    Sesión cerrada correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username" th:text="#{login.username}">Usuario</label>
                        <input class="form-control" type="text" id="username" name="username" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password" th:text="#{login.password}">Contraseña</label>
                        <input class="form-control" type="password" id="password" name="password">
                    </div>
                    <button class="btn btn-primary w-100" type="submit" th:text="#{login.submit}">Entrar</button>
                </form>

                <p class="mt-3"><a href="/public" th:text="#{login.back}">Volver a página pública</a></p>
            </div>
        </div>
    </div>
</body>
</html>
