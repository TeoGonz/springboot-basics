<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="#{denied.title}">Acceso denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <div class="container py-5">
        <div class="alert alert-danger">
            <h1 class="h4" th:text="#{denied.title}">403 · Acceso denegado</h1>
            <p class="mb-0">
                <span th:text="#{denied.body.pre}">Estás autenticado como</span>
                <strong sec:authentication="name">usuario</strong>,
                <span th:text="#{denied.body.post}">pero tu rol no permite acceder a esta página.</span>
            </p>
        </div>
        <a class="btn btn-primary" href="/user" th:text="#{denied.back}">Volver a mi zona</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-danger" type="submit" th:text="#{common.logout}">Cerrar sesión</button>
        </form>
    </div>
</body>
</html>
