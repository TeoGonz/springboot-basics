<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <div class="alert alert-danger">
        <h1 class="h4">403 · Acceso denegado</h1>
        <p class="mb-0">Estás autenticado como
            <strong sec:authentication="name">usuario</strong>,
            pero tu rol no permite acceder a esta página.</p>
    </div>
    <a class="btn btn-primary" href="/user">Volver a mi zona</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button class="btn btn-outline-danger" type="submit">Cerrar sesión</button>
    </form>
</body>
</html>
