<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{public.pageTitle}">Bitácora del curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --brand: #4f46e5; --brand-2: #06b6d4; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }

        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
            color: #fff;
        }
        .text-gradient {
            background: linear-gradient(90deg, #818cf8, #22d3ee);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .btn-brand { background: linear-gradient(90deg, var(--brand), var(--brand-2)); color: #fff; border: none; }
        .btn-brand:hover { color: #fff; filter: brightness(1.1); }

        .post-card {
            border: 1px solid #e5e7eb;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .post-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(79,70,229,.12); }
        .post-card .card-title a { color: inherit; text-decoration: none; }
        .post-card .card-title a:hover { color: var(--brand); }

        .post-banner {
            height: 120px; border-radius: 1rem 1rem 0 0;
            display: grid; place-items: center; font-size: 2.6rem; color: #fff;
        }
        .banner-i18n   { background: linear-gradient(120deg, #4f46e5, #06b6d4); }
        .banner-guards { background: linear-gradient(120deg, #0f766e, #22c55e); }
        .banner-next   { background: linear-gradient(120deg, #64748b, #94a3b8); }

        .week-badge { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav th:replace="~{fragments/nav :: publicNav}"></nav>

    <!-- Hero -->
    <header class="hero py-5">
        <div class="container py-4">
            <div class="row">
                <div class="col-lg-8">
                    <span class="badge rounded-pill px-3 py-2 mb-3"
                          style="background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);"
                          th:text="#{hero.badge}">📚 Un tema por semana</span>
                    <h1 class="display-5 fw-bold mb-3">
                        <span th:text="#{hero.title.pre}">Lo que vamos</span>
                        <span class="text-gradient" th:text="#{hero.title.mid}">aprendiendo</span>
                        <span th:text="#{hero.title.post}">en el curso</span>
                    </h1>
                    <p class="lead text-white-50 mb-0" th:text="#{hero.subtitle}">
                        Cada semana documentamos aquí un tema visto en clase.
                    </p>
                </div>
            </div>
        </div>
    </header>

    <!-- Entradas -->
    <main id="entradas" class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0" th:text="#{entries.heading}">Entradas</h2>
                <span class="text-muted small">
                    <i class="bi bi-clock-history me-1"></i><span th:text="#{entries.updated}">Actualizado cada semana</span>
                </span>
            </div>

            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="p : ${posts}">
                    <article class="card post-card h-100 rounded-4">
                        <div class="post-banner" th:classappend="'banner-' + ${p.banner}">
                            <i class="bi" th:classappend="${p.icon}"></i>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge week-badge" th:classappend="${p.badge}"
                                      th:text="|#{card.week} ${p.semana}|">Semana</span>
                                <small class="text-muted">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:if="${p.publicado}"
                                          th:text="${#temporals.format(p.fecha, 'dd MMM yyyy', #locale)}">18 jul 2026</span>
                                    <span th:unless="${p.publicado}" th:text="#{card.soon}">Próximamente</span>
                                </small>
                            </div>
                            <h5 class="card-title fw-semibold" th:classappend="${p.publicado} ? '' : 'text-muted'">
                                <span th:text="#{__${p.tituloKey}__}">Título</span>
                            </h5>
                            <p class="card-text text-muted small flex-grow-1" th:text="#{__${p.resumenKey}__}">Resumen</p>
                            <a th:if="${p.publicado}" href="#" class="btn btn-brand btn-sm align-self-start">
                                <span th:text="#{card.read}">Leer entrada</span> <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                            <button th:unless="${p.publicado}" class="btn btn-outline-secondary btn-sm align-self-start"
                                    disabled th:text="#{card.preparing}">En preparación</button>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </main>

    <!-- Acerca de -->
    <section id="acerca" class="py-5 bg-white border-top">
        <div class="container">
            <div class="row justify-content-center text-center">
                <div class="col-lg-8">
                    <h2 class="fw-bold mb-3" th:text="#{about.heading}">¿Qué es esta bitácora?</h2>
                    <p class="text-muted mb-0" th:text="#{about.body}">Descripción de la bitácora.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 py-4">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span><i class="bi bi-journal-code me-2 text-white"></i><span th:text="#{footer.brand}">Bitácora del curso</span></span>
            <span>© 2026</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
