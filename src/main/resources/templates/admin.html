<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.title}">Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <nav th:replace="~{fragments/nav :: appNav}"></nav>
    <div class="container py-5">
        <h1 th:text="#{admin.title}">Zona de administración</h1>
        <p class="lead">
            <span th:text="#{admin.greeting}">Hola</span>,
            <strong sec:authentication="name">admin</strong>.
            <span th:text="#{admin.note}">Solo accesible con rol ADMIN.</span>
        </p>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger" type="submit" th:text="#{common.logout}">Cerrar sesión</button>
        </form>
    </div>
</body>
</html>
